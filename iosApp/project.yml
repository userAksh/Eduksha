name: iosApp
options:
  bundleIdPrefix: in.eduksha
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.eduksha.app.ios
        INFOPLIST_FILE: iosApp/Info.plist
        PRODUCT_NAME: iosApp
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    dependencies:
      - sdk: SwiftUI.framework
